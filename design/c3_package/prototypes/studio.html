<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入戏 世界工作台 C3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;color:#172a25;background:#f5f6f3;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce3de;background:#fff;color:inherit;border-radius:9px;padding:9px 13px;transition:background .12s,transform .12s}button:hover{background:#eef3ef}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:default}button.primary{background:#245f50;color:white;border-color:#245f50}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #9bbaa8;outline-offset:3px}input,select{max-width:100%;padding:10px;border:1px solid #dce3de;border-radius:8px;background:white;color:#172a25}h1,h2,h3,p{margin:0}p{line-height:1.7}small,.muted{color:#61716a}label{display:block}.tag{display:inline-flex;align-items:center;background:#e9f0e9;border-radius:6px;padding:4px 8px;font-size:12px;color:#356251}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:14px}.caption{font-size:11px;letter-spacing:2px;color:#65756c}.testing{padding:10px 22px;background:#263c34;color:#edf4ef;display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap}.testing button{padding:5px 10px;background:#375247;color:white;border-color:#577465}.testing a{color:#eef5ed}.testing select{padding:4px 8px}.divider{height:1px;background:#e2e7e1;margin:18px 0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e1e6df;background:#fbfcf9}.brand{font-size:22px;font-weight:650;letter-spacing:2px}.project{border-left:1px solid #dce3de;padding-left:22px;margin-left:18px}.layout{display:grid;grid-template-columns:208px minmax(0,1fr) 326px;min-height:750px;height:calc(100vh - 127px)}nav{padding:26px 14px;border-right:1px solid #e1e6df;background:#f7f8f5}nav button{text-align:left;border:0;background:transparent;width:100%;margin:3px 0;padding:12px}nav button.active{background:#e3ece3;color:#245f50;font-weight:600}.navlabel{font-size:11px;color:#7b8981;margin:24px 12px 8px;letter-spacing:1px}.center{min-width:0;position:relative;display:flex;flex-direction:column}.toolbar{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f9faf7;border-bottom:1px solid #e3e8e1}.toolbar h1{font-size:23px}.graph{flex:1;min-height:570px;overflow:auto;position:relative;background-image:radial-gradient(#cfd8cf .8px,transparent .8px);background-size:22px 22px}.canvas{position:relative;width:810px;height:570px;margin:0 auto}.location{position:absolute;width:240px;min-height:134px;padding:19px;border:1px solid #d6e0d7;border-radius:15px;background:#fdfefa;box-shadow:0 6px 20px #273d3210;text-align:left}.location strong{font-size:18px;display:block;margin:10px 0}.location small{display:block}.location.current{border:2px solid #397361}.location.secret{border-style:dashed;background:#f1f5ee}.location .number{font-size:11px;letter-spacing:1px;color:#76877b}.location .detail{border-top:1px solid #e5eae1;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;font-size:12px;color:#5f7364}.canvas svg{position:absolute;inset:0}.edge{position:absolute;left:317px;top:136px;border-color:#c2d2c5;font-size:12px;padding:7px 11px;box-shadow:0 3px 8px #263e3310}.sceneNote{padding:16px 24px;border-top:1px solid #dce4da;background:#fafbf7;font-size:13px}.inspector{background:#fdfefa;border-left:1px solid #dfe5dc;padding:24px;overflow:auto}.inspector h2{font-size:20px;margin:10px 0 8px}.field{margin:20px 0}.field label{font-size:12px;color:#5b6d62;margin-bottom:8px}.field input,.field select{width:100%}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule{border-left:2px solid #94ae99;padding-left:12px;font-size:13px;line-height:1.8;color:#465f50}.status{font-size:12px;color:#5e7263}.toast{min-height:20px;margin-top:15px;color:#245f50}.listpanel{padding:28px;display:grid;gap:12px}.entity{border:1px solid #dfe5dc;border-radius:12px;background:white;padding:20px}.entity h3{margin:8px 0}.legend{position:absolute;bottom:18px;left:22px;border:1px solid #dce3d9;background:#ffffffdd;backdrop-filter:blur(12px);border-radius:10px;padding:10px 14px;font-size:12px;color:#68796b}.closeInspector{display:none}@media(max-width:1279px){.layout{grid-template-columns:180px minmax(0,1fr)}.inspector{display:none;position:fixed;right:0;top:78px;bottom:0;width:340px;z-index:10;box-shadow:-10px 0 30px #16251b20}.inspector.open{display:block}.closeInspector{display:block}}@media(max-width:899px){header{padding:0 16px}.project{display:none}header .status{display:none}.layout{display:block;height:auto;min-height:0}nav{display:flex;padding:8px;overflow:auto;border-bottom:1px solid #ddd}nav .navlabel,nav .outline{display:none}nav button{width:auto;white-space:nowrap}.toolbar{padding:18px}.toolbar h1{font-size:20px}.graph{height:540px;flex:none}.canvas{margin:0}.inspector{top:0;width:min(100%,380px)}.sceneNote{padding:15px}.testing{padding:10px 16px}}
</style><body><header><div class="row"><span class="brand">入戏 <small style="font-size:11px;letter-spacing:3px">STUDIO</small></span><div class="project"><b>雨夜档案馆</b><p class="muted" style="font-size:12px">世界设计 · 草稿</p></div></div><div class="row"><span class="status" id="saveStatus">所有更改已保存</span><button id="undo">撤销</button><button id="save">保存</button><button class="primary" id="validate">校验</button></div></header>
<div class="testing">设计参考 · 本地样例，不连接已开发项目 <a href="interactions.html">查看玩家互动</a><span id="testnote">未开启角色视角时为作者全知</span></div>
<div class="layout"><nav><div class="navlabel">项目内容</div><button class="active" data-view="world">◈　世界地图</button><button data-view="roles">◎　角色与目标</button><button data-view="events">⌁　剧情事件</button><div class="navlabel">地点索引</div><div class="outline"><button data-scene="duty">值班室</button><button data-scene="archive">档案室</button><button data-scene="repair">维修间</button><button data-scene="exit">安全出口</button></div></nav><main class="center"><div class="toolbar"><div><p class="caption" id="breadcrumb">WORLD / 雨夜档案馆</p><h1 id="heading">让世界有路可走</h1></div><div class="row"><select id="role" aria-label="预览视角"><option value="author">作者全知</option><option value="investigator">调查员视角</option><option value="technician">技师视角</option></select><select id="snapshot" aria-label="预览状态"><option value="initial">初始状态</option><option value="sealed">首次通过后</option><option value="restored">修电成功后</option></select></div></div><div class="graph" id="graph"></div><div class="sceneNote" id="footnote">选择连线查看双向通行规则；选择地点进入场景。切换快照只影响预览。</div></main><aside class="inspector" id="inspector"><button class="closeInspector" id="closeInspector">关闭检查器</button><p class="caption">PASSAGE / 01</p><h2>值班室 ↔ 档案室</h2><p class="muted">默认双向，可分别配置去程与返程。</p><div class="divider"></div><div class="field"><label for="direction">通行方向</label><select id="direction"><option value="both">双向通路</option><option value="oneway">仅值班室 → 档案室</option></select></div><div class="split"><div class="field"><label for="cost">去程费用</label><input id="cost" type="number" min="0" max="9" value="1"></div><div class="field"><label for="backcost">返程费用</label><input id="backcost" type="number" min="0" max="9" value="1"></div></div><div class="field"><label for="seal">到达后事件</label><select id="seal"><option value="yes">首次到达后封闭返程</option><option value="no">无封闭事件</option></select></div><div class="field"><label>恢复条件</label><p class="rule">技师修复备用电源成功<br>返程门恢复开放<br>现场观察者收到变化提示</p></div><div class="divider"></div><p class="caption">规则摘要</p><p id="summary" style="margin:10px 0 20px"></p><button class="primary" id="apply">应用修改</button><p id="notice" role="status" class="toast"></p></aside></div>
<script>
let model={direction:'both',cost:1,backcost:1,seal:'yes'},previous=null;let view='world';const $=id=>document.getElementById(id);const names={duty:'值班室',archive:'档案室',repair:'维修间',exit:'安全出口'};
try{const m=JSON.parse(localStorage.getItem('ruxi-c3-studio'));if(m)model=m}catch(e){}
function sync(){for(const k of Object.keys(model))$(k).value=model[k];$('backcost').disabled=model.direction==='oneway';$('summary').textContent=`去程 ${model.cost} 点，${model.direction==='oneway'?'没有返程':`返程 ${model.backcost} 点`}。${model.seal==='yes'&&model.direction==='both'?'首次到达后返程封闭，修电成功恢复。':'没有额外的返程封闭效果。'}`}
function card(id,x,y,desc,count,extra=''){return `<button class="location ${extra}" style="left:${x}px;top:${y}px" data-scene="${id}"><span class="number">${id==='repair'?'PRIVATE LOCATION':'LOCATION'}</span><strong>${names[id]}</strong><small>${desc}</small><span class="detail"><span>${count}</span><span>进入场景 ↗</span></span></button>`}
function render(){const role=$('role').value,s=$('snapshot').value;const hidden=role==='investigator';document.querySelectorAll('nav button[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===view));document.querySelectorAll('[data-scene="repair"]').forEach(e=>e.hidden=hidden);if(view!=='world')return;
$('heading').textContent='世界地图';$('breadcrumb').textContent='WORLD / 雨夜档案馆';const blocked=s==='sealed'&&model.seal==='yes'&&model.direction==='both';const seesChange=role!=='investigator';const edgeText=blocked?(seesChange?'返程已封闭':'返程情况待确认'):(model.direction==='both'?'双向通行':'单向通行');
$('graph').innerHTML=`<div class="canvas"><svg viewBox="0 0 810 570" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#6c8c78"/></marker></defs><path d="M280 157H494" stroke="#6c8c78" stroke-width="2" marker-end="url(#arrow)" ${model.direction==='both'?'marker-start="url(#arrow)"':''}/><path d="M613 236V373" stroke="#6c8c78" stroke-width="2" marker-end="url(#arrow)"/>${hidden?'':'<path d="M160 236V373M280 445H493" fill="none" stroke="#91a893" stroke-width="2" stroke-dasharray="6 6"/>'}</svg>${card('duty',40,72,'雨声隔着玻璃，收据留在桌边。','起点 · 已定位','current')}${card('archive',494,72,'登记簿藏在上锁的保险柜内。','密码互动 · 1')}${hidden?'':card('repair',40,365,'熟悉电路的人知道这条暗道。','私人知识 · 骰子互动','secret')}${card('exit',494,365,'封馆之前，这条退路仍然开放。','出口 · 单向抵达')}<button class="edge" id="passage">${edgeText} · ${model.cost} 点</button></div><div class="legend">实线 普通通路　 ·　 虚线 秘密关联</div>`;
$('passage').onclick=()=>$('inspector').classList.add('open');bindScenes();$('footnote').textContent=role==='author'?'作者全知预览。秘密地点可见；实际玩家数据需要由服务端按角色投影。':'当前为本地角色过滤示例，不是安全边界。远处变化不自动作为已知事实。'}
function bindScenes(){document.querySelectorAll('[data-scene]').forEach(e=>e.onclick=()=>scene(e.dataset.scene))}
function scene(id){if(id==='repair'&&$('role').value==='investigator')return;view='scene';$('breadcrumb').textContent='WORLD / 雨夜档案馆 / '+names[id];$('heading').textContent=names[id];const desc=id==='archive'?['保险柜','输入密码 · 1 点','输入四位数字打开柜门，最多三次尝试。']:id==='repair'?['备用电源','骰子判定 · 1 点','技师成功率 60%，失败仍可从安全出口撤离。']:id==='duty'?['桌面收据','调查 · 1 点','发现保险柜密码的线索。']:['出口标识','撤离 · 1 点','完成撤离，保留已获得的个人知识。'];$('graph').innerHTML=`<div class="listpanel"><div><button id="backWorld">← 世界地图</button></div><article class="entity"><p class="caption">场景对象</p><h3>${desc[0]}</h3><p>${desc[2]}</p><div class="divider"></div><span class="tag">${desc[1]}</span></article><article class="entity"><h3>上下文与关联</h3><p>对象、互动和事件引用同一实体。返回世界地图保留预览视角。</p></article></div>`;$('backWorld').onclick=()=>{view='world';render()}}
document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{view=e.dataset.view;if(view==='world'){render();return}$('heading').textContent=view==='roles'?'角色与目标':'剧情事件';$('breadcrumb').textContent='WORLD / '+$('heading').textContent;const rows=view==='roles'?[['调查员','公开目标：取得并提交证据。'],['技师','个人知识：隐藏维修间。修电判定 +10。'],['保管员','秘密阵营：掩护方。销毁原件且阻止副本提交。']]:[['首次抵达','返程门被封闭；只通知获准观察者。'],['修电成功','解除返程阻碍，更新现场观察。'],['第四轮结束','结算公共、阵营和个人结果。']];$('graph').innerHTML='<div class="listpanel">'+rows.map(x=>`<article class="entity"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')+'</div>'});
$('apply').onclick=()=>{let c=+$('cost').value,b=+$('backcost').value;if(!Number.isInteger(c)||!Number.isInteger(b)||c<0||b<0||c>9||b>9){$('notice').textContent='费用必须为 0–9 的整数。';return}previous={...model};model={cost:c,backcost:b,direction:$('direction').value,seal:$('seal').value};sync();render();$('saveStatus').textContent='有未保存更改';$('notice').textContent='已更新同一通路，地图与摘要同步。'};
$('direction').onchange=()=>$('backcost').disabled=$('direction').value==='oneway';$('undo').onclick=()=>{if(previous){model=previous;previous=null;sync();render();$('saveStatus').textContent='撤销完成 · 待保存'}};$('save').onclick=()=>{localStorage.setItem('ruxi-c3-studio',JSON.stringify(model));$('saveStatus').textContent='已保存至本地'};$('validate').onclick=()=>{$('inspector').classList.add('open');$('notice').textContent=model.direction==='oneway'&&model.seal==='yes'?'警告：不存在返程，返程封闭事件无效。':'样例通路检查通过；完整路径验证需实际规则引擎。'};$('closeInspector').onclick=()=>$('inspector').classList.remove('open');$('role').onchange=$('snapshot').onchange=()=>{view='world';render()};sync();render();bindScenes();
</script></body></html>
