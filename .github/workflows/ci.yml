name: Verify Ruxi
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruxi_test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/ruxi_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.1'
          elixir-version: '1.19.5'
      - run: mix deps.get
        working-directory: services/core
      - run: mix run --no-start priv/repo/init_schema.exs
        working-directory: services/core
      - run: mix ecto.migrate
        working-directory: services/core
      - run: mix compile --warnings-as-errors && mix test
        working-directory: services/core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Seed live Flutter integration database
        run: mix run priv/repo/seeds.exs
        working-directory: services/core
        env:
          MIX_ENV: dev
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/ruxi_test
      - name: Start Core for actual Flutter HTTP and WebSocket regression
        run: |
          scripts/start_core.sh > /tmp/ruxi-live-core.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/ruxi-live-core.log
          exit 1
        env:
          MIX_ENV: dev
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/ruxi_test
      - name: Verify actual Flutter client synchronization, clock and reconnect
        run: flutter pub get && flutter test --dart-define=RUXI_LIVE_TEST=true test/live_connection_test.dart
        working-directory: apps/mobile
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e . && pip install pytest==9.1.1 && pytest -q
        working-directory: services/worker
      - run: python scripts/serve_web_test.py
      - run: python scripts/generate_contracts.py && git diff --exit-code contracts
  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t ruxi-core:ci -f infra/core.production.Dockerfile .
      - run: docker build --progress=plain -t ruxi-worker:ci services/worker
  protocol-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/protocol_client.test.mjs
  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile, creator]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get && flutter analyze && flutter test && flutter build web
        working-directory: apps/${{ matrix.app }}

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: apps/admin
      - uses: actions/upload-artifact@v4
        with:
          name: ruxi-admin-static
          path: apps/admin/dist
