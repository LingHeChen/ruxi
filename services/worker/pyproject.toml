[project]
name = "ruxi-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
 "uvicorn>=0.34,<1",
 "httpx>=0.28,<1",
 "jsonschema>=4.23,<5",
 "python-dotenv>=1,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker", "adapters"]
