<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入戏 玩家端交互原型</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#172522;font:15px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid #d4ded8;border-radius:12px;background:#fff;color:inherit;padding:12px 16px;cursor:pointer;min-height:48px;transition:transform 90ms,background 140ms}button:active{transform:scale(.98)}button:hover{background:#e7ede8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fae9b;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#245f52;color:white;border:0}.primary:hover{background:#174c40}.quiet{background:transparent}.muted{color:#5a6964;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid #dbe1db}.brand{font-size:20px;font-weight:700;letter-spacing:4px}.pill{display:inline-block;background:#e6ede5;border-radius:30px;padding:6px 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:white;padding:24px;border:1px solid #dde3dd;border-radius:24px}.page{max-width:1100px;margin:auto;padding:32px 24px 100px}h1{font-size:38px;letter-spacing:-1px;margin:12px 0 16px}h2{font-size:23px}p{line-height:1.8}nav{display:flex;gap:10px;padding:12px;justify-content:center}nav.main{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ffffffef;border:1px solid #dde2dc;border-radius:22px;box-shadow:0 8px 24px #17252212;z-index:3}input,textarea,select{border:1px solid #aab9ad;border-radius:12px;background:#fff;padding:12px;width:100%;color:inherit}label{display:block;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.error{color:#a73535}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:16px;background:#172522;color:#fff;z-index:10;max-width:90vw}.overlay{position:fixed;inset:0;background:#07151080;z-index:5;display:flex;align-items:flex-end;justify-content:center}.panel{background:#fafbf8;width:min(680px,100%);max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;padding:26px;animation:enter 280ms cubic-bezier(.2,.8,.2,1)}.panel .close{float:right}.panel h2{margin-top:8px}.item{padding:16px 0;border-bottom:1px solid #d9e0d8}.spacer{height:18px}@keyframes enter{from{transform:translateY(45px);opacity:0}to{transform:none;opacity:1}}.reduce *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:720px){header{padding:14px 18px}h1{font-size:30px}.page{padding:20px 18px 100px}.panel{padding:22px}.row>button{flex-grow:1}}

</style><body><header><div class="brand">入戏 <span class="muted"> / PLAY</span></div><span class="pill">互动原型 · 本地模拟</span></header><main id="app"></main><div id="modal"></div><div id="toast" role="status"></div><script>
const story={"schema_version": 3, "id": "restaurant", "title": "停电之前", "rules": {"ap_per_round": 3, "step_timeout_s": 45, "proposal_ttl_s": 60, "round_limit": 4}, "roles": [{"id": "guest", "label": "旅客", "location": "dining", "knowledge": []}, {"id": "doctor", "label": "医生", "location": "dining", "knowledge": []}, {"id": "reporter", "label": "记者", "location": "dining", "knowledge": []}], "locations": [{"id": "dining", "label": "餐厅", "description": "雨声掩盖了灯管的嗡鸣。", "discovered": true}, {"id": "hall", "label": "走廊", "description": "后厨门上的指示灯忽明忽暗。", "discovered": true}, {"id": "kitchen", "label": "后厨", "description": "电源箱旁有焦糊味。", "discovered": true}], "links": [{"id": "dining_hall", "from": "dining", "to": "hall", "cost": 1, "condition": {"op": "all", "args": []}}, {"id": "hall_dining", "from": "hall", "to": "dining", "cost": 1, "condition": {"op": "all", "args": []}}, {"id": "hall_kitchen", "from": "hall", "to": "kitchen", "cost": 1, "condition": {"op": "eq", "ref": "world.door_open", "value": true}}, {"id": "kitchen_hall", "from": "kitchen", "to": "hall", "cost": 1, "condition": {"op": "all", "args": []}}], "objects": [{"id": "dishes", "label": "餐具", "location": "dining", "tags": ["inspectable"]}, {"id": "waiter", "label": "服务员", "location": "dining", "tags": ["npc"]}, {"id": "fire_extinguisher", "label": "灭火器", "location": "hall", "tags": ["tool"]}, {"id": "door", "label": "后厨门", "location": "hall", "tags": ["breakable"]}, {"id": "power_box", "label": "电源箱", "location": "kitchen", "tags": ["switch"]}], "clues": [{"id": "stain", "text": "餐具边缘有焦黑粉末，像从通风口落下。", "shareable": true}, {"id": "access", "text": "服务员允许检查后厨，门禁为0427。", "shareable": true}], "actions": [{"id": "inspect", "label": "检查餐具", "location": "dining", "target": "dishes", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "stain", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "meal", "label": "用餐", "location": "dining", "target": null, "cost": 2, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "access", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "ask", "label": "询问服务员", "location": "dining", "target": "waiter", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "access", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "take_tool", "label": "取下灭火器", "location": "hall", "target": "fire_extinguisher", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "grant", "ref": "fire_extinguisher"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "unlock", "label": "输入门禁", "location": "hall", "target": "door", "cost": 1, "condition": {"op": "all", "args": [{"op": "has_knowledge", "ref": "access"}, {"op": "eq", "ref": "world.door_open", "value": false}]}, "effects": [{"op": "set", "ref": "world.door_open", "value": true}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "switch_off", "label": "关闭故障电源", "location": "kitchen", "target": "power_box", "cost": 1, "condition": {"op": "eq", "ref": "world.power_off", "value": false}, "effects": [{"op": "set", "ref": "world.power_off", "value": true}], "failure": [], "threshold": null, "max_uses": 1}], "templates": [{"id": "force_door", "label": "用灭火器破门", "location": "hall", "target": "door", "cost": 2, "condition": {"op": "all", "args": [{"op": "owns", "ref": "fire_extinguisher"}, {"op": "eq", "ref": "world.door_open", "value": false}]}, "effects": [{"op": "set", "ref": "world.door_open", "value": true}, {"op": "set", "ref": "world.noise", "value": true}], "failure": [], "threshold": null, "max_uses": 1, "intent": "使用工具破坏目标", "required_tag": "breakable"}], "events": [{"id": "safe_ending", "trigger": "step_end", "priority": 10, "condition": {"op": "eq", "ref": "world.power_off", "value": true}, "effects": [{"op": "end", "value": "safe"}], "once": true}, {"id": "timeout", "trigger": "round_end", "priority": 100, "condition": {"op": "gte", "ref": "clock.round", "value": 4}, "effects": [{"op": "end", "value": "evacuated"}], "once": true}], "initial": {"world": {"door_open": false, "power_off": false, "noise": false}, "inventory": {"guest": [], "doctor": [], "reporter": []}}, "media": [{"id": "opening", "kind": "text", "uri": "", "audience": "public", "summary": "三位客人发现餐厅电力异常。可以调查、用餐或与服务员交谈。"}, {"id": "safe", "kind": "text", "uri": "", "audience": "public", "summary": "电源被及时关闭，餐厅排除了危险。"}, {"id": "evacuated", "kind": "text", "uri": "", "audience": "public", "summary": "警报响起，所有人离开餐厅。谜团暂未解开。"}]};let page='discover',dialog='',proposal=null,pending=null,offline=false,focusBefore=null,taskTimer;
const fresh=()=>({name:'旅客',round:1,step:1,ap:3,loc:'dining',known:[],inventory:[],world:{door_open:false,power_off:false,noise:false},used:{},log:['雨声掩盖了灯管的嗡鸣。服务员似乎有些心不在焉。'],ending:null,reduce:false});
let state;try{state=JSON.parse(localStorage.getItem('ruxi_demo'))||fresh()}catch{state=fresh()}
function save(){localStorage.setItem('ruxi_demo',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){document.querySelector('#toast').className='toast';document.querySelector('#toast').textContent=t;setTimeout(()=>{document.querySelector('#toast').textContent='';document.querySelector('#toast').className=''},2500)}
function go(x){page=x;closePanel();render()}function nav(){return `<nav class="main"><button onclick="go('discover')">发现</button><button onclick="go('games')">我的游戏</button><button onclick="go('me')">我的</button></nav>`}
function condition(c){if(c.op==='all')return c.args.every(condition);if(c.op==='has_knowledge')return state.known.includes(c.ref);if(c.op==='owns')return state.inventory.includes(c.ref);if(c.op==='eq')return state.world[c.ref.split('.')[1]]===c.value;return false}
function available(){return story.actions.filter(a=>a.location===state.loc&&!state.used[a.id]&&condition(a.condition)&&!(a.id==='take_tool'&&state.inventory.includes('fire_extinguisher')))}
function render(){document.body.classList.toggle('reduce',state.reduce);let h='';if(page==='discover'){h=`<div class="page"><span class="pill">今晚，成为故事里的人</span><h1>一场雨，三个陌生人。</h1><p class="muted">选择一段故事，邀请朋友一起入戏。</p><label for="search">搜索剧本</label><input id="search" placeholder="搜索名称或题材" oninput="document.getElementById('storycard').hidden=!('停电之前 餐厅 悬疑'.includes(this.value))"><div class="spacer"></div><article id="storycard" class="card"><div style="height:150px;background:linear-gradient(120deg,#284d3c,#b6b388);border-radius:16px"></div><h2>停电之前</h2><p>餐厅的灯闪了三次。你们有四轮时间，查明问题并作出行动。</p><div class="row"><span class="pill">3 人 · 地图探索</span><button class="primary" onclick="go('detail')">查看故事</button></div></article></div>`}
if(page==='detail')h=`<div class="page"><button onclick="go('discover')">返回发现</button><h1>停电之前</h1><p>这是一场三人协作的互动故事。可用餐、调查、与人物交谈，或提出自己的办法。</p><p>推荐操作即可完成体验。没有恐怖画面；包含轻度危险情境。演示使用文字与示意场景。</p><button class="primary" onclick="go('lobby')">创建房间</button></div>`;
if(page==='lobby')h=`<div class="page"><h1>等朋友，一起入戏。</h1><p>邀请码 DEMO0427 · 演示不连接真实服务</p><div class="grid">${['旅客 · 你','医生 · 模拟队友','记者 · 模拟队友'].map((n,i)=>`<div class="card"><span class="pill">${i?'已准备':'已选角色'}</span><h2>${n}</h2><p>角色秘密在进入故事后由各自查看。</p></div>`).join('')}</div><div class="spacer"></div><button class="primary" onclick="state=fresh();save();go('play')">准备并开始演示</button><button onclick="go('discover')">离开大厅</button></div>`;
if(page==='games')h=`<div class="page"><h1>我的游戏</h1><div class="card"><h2>停电之前</h2><p>${state.ending?'已结束':'第 '+state.round+' 轮 · '+story.locations.find(x=>x.id===state.loc).label}</p><button class="primary" onclick="go(state.ending?'ending':'play')">${state.ending?'查看结局':'继续游戏'}</button></div></div>`;
if(page==='me')h=`<div class="page"><h1>${esc(state.name)}</h1><p>游客演示身份 · 数据仅保存在本浏览器</p><div class="card"><label for="nickname">昵称</label><input id="nickname" value="${esc(state.name)}" maxlength="20"><button onclick="state.name=document.getElementById('nickname').value||'旅客';save();toast('资料已保存');render()">保存资料</button><button onclick="openPanel('settings')">播放与显示设置</button><button onclick="openPanel('help')">帮助与恢复说明</button><button onclick="openPanel('delete')">清除演示身份</button></div></div>`;
if(page==='play'){let aa=available();h=`<div class="demo">本地演示：队友由按钮模拟；没有真实 AI、WS 或视频服务。<button style="min-height:28px;padding:2px 8px" onclick="offline=!offline;render()">${offline?'恢复网络':'模拟断线'}</button></div><section class="stage"><div class="scene"><div class="window"></div><div class="lamp"></div><div class="table"></div><div class="vase"></div><div class="person"></div></div><div class="stage-top"><span class="pill">${story.locations.find(x=>x.id===state.loc).label} · 第 ${state.round} 轮</span><span class="pill budget">行动力 ${state.ap-(pending?.cost||0)} / 3 ${pending?'· 已预留 '+pending.cost:''}</span></div><div class="caption">BEFORE THE LIGHTS GO OUT</div><div class="dialogue"><div class="speaker">${pending?'等待队友':'主持人'} ${offline?' · 连接已断开':''}</div><p id="narration">${esc(pending?'你的行动已提交。等待本步结算后，结果才会生效。':state.log.at(-1))}</p><div class="choices">${aa.slice(0,3).map(a=>`<button ${offline||pending||a.cost>state.ap?'disabled':''} onclick="submit('${a.id}')">${a.label}<small>${a.cost} 点行动力</small></button>`).join('')||'<span>此处没有新的推荐行动，可查看地图或结束本轮。</span>'}</div><div class="tools"><button onclick="openPanel('map')">地图</button><button onclick="openPanel('more')">全部操作</button><button onclick="openPanel('free')">其他行动…</button><button onclick="openPanel('clues')">线索与物品</button><button onclick="openPanel('log')">记录</button><button onclick="openPanel('menu')">菜单</button></div>${pending?'<button class="primary" style="margin-top:12px" onclick="resolve()">模拟队友确认并结算</button> <button onclick="pending=null;render()">取消未锁定行动</button>':''}</div></section>`}
if(page==='ending')h=`<div class="page"><span class="pill">故事已结束</span><h1>${state.ending==='safe'?'灯光终于安静下来。':'雨里，还有未解的谜。'}</h1><p>${state.ending==='safe'?'你们关闭了故障电源，餐厅恢复了安全。':'警报响起，你们随其他客人离开餐厅。'}</p><div class="card"><h2>你的经历</h2>${state.log.map(x=>`<p>${esc(x)}</p>`).join('')}</div><button onclick="go('games')">返回我的游戏</button><button onclick="go('lobby')">另开一局</button></div>`;
document.querySelector('#app').innerHTML=h+(page==='play'?'':nav());save()}
function submit(id){if(offline)return toast('连接恢复后再行动');if(pending)return toast('请先取消或结算当前行动');let a=story.actions.concat(story.templates).find(x=>x.id===id);if(id.startsWith('move:')){let l=story.links.find(x=>x.id===id.slice(5));if(l.from!==state.loc||!condition(l.condition))return toast('暂时无法到达');a={id,cost:l.cost,effects:[{op:'move',value:l.to}],label:'前往'+story.locations.find(x=>x.id===l.to).label}}
if(!a||a.cost>state.ap||a.location&&a.location!==state.loc||a.condition&&!condition(a.condition)||(!id.startsWith('move:')&&state.used[a.id]))return toast('当前无法执行');pending=a;closePanel();render()}
function resolve(){if(offline)return toast('连接已断开，等待恢复');if(!pending)return;let a=pending;pending=null;state.ap-=a.cost;state.used[a.id]=true;for(let e of a.effects){if(e.op==='move')state.loc=e.value;if(e.op==='set')state.world[e.ref.split('.')[1]]=e.value;if(e.op==='reveal'&&!state.known.includes(e.ref))state.known.push(e.ref);if(e.op==='grant')state.inventory.push(e.ref)}let text={inspect:'你检查餐具，在边缘发现焦黑粉末。',meal:'服务员端来餐点，并告诉你可以去后厨查看。',ask:'服务员给了你后厨门禁：0427。',take_tool:'你取下了灭火器。',unlock:'后厨的门锁打开了。',switch_off:'你切断故障电源，刺耳的嗡鸣停止了。',force_door:'你用灭火器砸开后厨门，响声引来了其他人的注意。'};state.log.push(text[a.id]||a.label+'。');if(state.world.power_off){state.ending='safe';go('ending');return}state.step++;if(state.ap===0||state.step>3)nextRound();render()}
function nextRound(){pending=null;if(state.round>=4){state.ending='evacuated';page='ending'}else{state.round++;state.step=1;state.ap=3;state.log.push('时间继续流逝。新一轮开始，行动力恢复。')}save()}
function closePanel(){clearTimeout(taskTimer);document.querySelector('#modal').innerHTML='';proposal=null;if(focusBefore?.isConnected)focusBefore.focus()}
function openPanel(kind){focusBefore=document.activeElement;let body='';if(kind==='map')body=`<h2>地点地图</h2><p>选择相邻地点移动。画布距离不代表行动消耗。</p><div class="map">${story.locations.map(l=>{let link=story.links.find(x=>x.from===state.loc&&x.to===l.id);return `<button class="${l.id===state.loc?'here':''}" ${!link||!condition(link.condition)||pending||offline?'disabled':''} onclick="submit('move:${link?.id}')">${l.label}<br><small>${l.id===state.loc?'当前位置':link?(condition(link.condition)?'移动 1 点':'门尚未打开'):'非相邻地点'}</small></button>`}).join('')}</div>`;
if(kind==='more')body='<h2>全部可行操作</h2>'+available().map(a=>`<div class="item"><button ${pending||offline||a.cost>state.ap?'disabled':''} onclick="submit('${a.id}')">${a.label} · ${a.cost} 点</button></div>`).join('');
if(kind==='free')body=`<h2>你想做什么？</h2><p class="muted">演示仅识别“检查餐具”及“用灭火器破门”。正式版由 AI 判断，规则系统确认成本。</p><label for="intent">行动描述</label><textarea id="intent" rows="3" placeholder="例如：我想用灭火器砸开后厨门" oninput="sessionStorage.setItem('draft_intent',this.value)">${esc(sessionStorage.getItem('draft_intent')||'')}</textarea><button class="primary" ${pending||offline?'disabled':''} onclick="judge()">判断可行性</button><div id="proposal" aria-live="polite"></div>`;
if(kind==='clues')body='<h2>线索与物品</h2>'+state.known.map(id=>`<div class="item"><p>${story.clues.find(c=>c.id===id).text}</p><button onclick="toast('演示：已向模拟队友分享这条线索')">确认分享给队友</button></div>`).join('')+'<p>物品：'+(state.inventory.includes('fire_extinguisher')?'灭火器':'暂无')+'</p>';
if(kind==='log')body='<h2>已知记录</h2><p class="muted">回看不会回滚世界，也不会消耗行动力。</p>'+state.log.map(x=>'<p>'+esc(x)+'</p>').join('');
if(kind==='menu')body='<h2>局内菜单</h2><button onclick="openPanel(\'settings\')">播放与显示设置</button><button onclick="pending=null;nextRound();closePanel();render()">结束本轮并模拟全员结束</button><button onclick="go(\'games\')">保存并离开演示</button>';
if(kind==='settings')body=`<h2>播放与显示</h2><label><input style="width:auto" type="checkbox" ${state.reduce?'checked':''} onchange="state.reduce=this.checked;save();document.body.classList.toggle('reduce',state.reduce)"> 减少动态效果</label><p>演示为文字模式，无真实视频与配音。正式版提供音量、字幕和文字速度。</p><p>自动播放只推进对白，遇到行动选择会停止。</p>`;
if(kind==='help')body='<h2>帮助与身份恢复</h2><p>本文件是离线交互参考，不创建真实账号，因此没有有效恢复码。刷新后可从“我的游戏”继续本地演示。</p><label for="feedback">反馈</label><textarea id="feedback"></textarea><button onclick="localStorage.setItem(\'demo_feedback\',document.getElementById(\'feedback\').value);toast(\'反馈已保存在本地演示中\')">保存反馈</button>';
if(kind==='delete')body='<h2>清除本地演示数据？</h2><p>当前进度与昵称将被清除。这不是生产服务的账号注销。</p><button class="primary" onclick="localStorage.clear();state=fresh();go(\'discover\')">确认清除</button>';
document.querySelector('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closePanel()"><section class="panel" role="dialog" aria-modal="true" aria-label="${kind}"><button class="close" onclick="closePanel()" aria-label="关闭面板">关闭</button>${body}</section></div>`;document.querySelector('.panel button').focus()}
function judge(){let text=document.querySelector('#intent').value;document.querySelector('#proposal').textContent='正在判断…（本地规则模拟）';taskTimer=setTimeout(()=>{let a=text.includes('灭火器')?story.templates[0]:text.includes('餐具')?story.actions[0]:null;let ok=a&&a.location===state.loc&&condition(a.condition)&&a.cost<=state.ap&&!state.used[a.id];proposal=ok?{a,expires:Date.now()+60000}:null;document.querySelector('#proposal').innerHTML=ok?`<div class="item"><h3>${a.label}</h3><p>消耗 ${a.cost} 点行动力。${a.id==='force_door'?'会制造噪声。':'将执行一次调查。'}确认后提交，等待本步结算。</p><button class="primary" onclick="confirmProposal()">确认行动</button><button onclick="closePanel()">取消</button></div>`:'<p>当前没有可执行的对应行动。请明确目标，或选择预设操作。本次未扣点。</p>'},350)}
function confirmProposal(){if(!proposal||Date.now()>proposal.expires)return toast('提案已过期，请重新判断');submit(proposal.a.id)}
document.addEventListener('keydown',e=>{let p=document.querySelector('.panel');if(!p)return;if(e.key==='Escape')closePanel();if(e.key==='Tab'){let f=[...p.querySelectorAll('button:not(:disabled),input,textarea,select')],a=f[0],b=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});render();
</script></body></html>
