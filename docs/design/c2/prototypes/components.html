<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#172522;font:15px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid #d4ded8;border-radius:12px;background:#fff;color:inherit;padding:12px 16px;cursor:pointer;min-height:48px;transition:transform 90ms,background 140ms}button:active{transform:scale(.98)}button:hover{background:#e7ede8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fae9b;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#245f52;color:white;border:0}.primary:hover{background:#174c40}.quiet{background:transparent}.muted{color:#5a6964;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid #dbe1db}.brand{font-size:20px;font-weight:700;letter-spacing:4px}.pill{display:inline-block;background:#e6ede5;border-radius:30px;padding:6px 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:white;padding:24px;border:1px solid #dde3dd;border-radius:24px}.page{max-width:1100px;margin:auto;padding:32px 24px 100px}h1{font-size:38px;letter-spacing:-1px;margin:12px 0 16px}h2{font-size:23px}p{line-height:1.8}nav{display:flex;gap:10px;padding:12px;justify-content:center}nav.main{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ffffffef;border:1px solid #dde2dc;border-radius:22px;box-shadow:0 8px 24px #17252212;z-index:3}input,textarea,select{border:1px solid #aab9ad;border-radius:12px;background:#fff;padding:12px;width:100%;color:inherit}label{display:block;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.error{color:#a73535}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:16px;background:#172522;color:#fff;z-index:10;max-width:90vw}.overlay{position:fixed;inset:0;background:#07151080;z-index:5;display:flex;align-items:flex-end;justify-content:center}.panel{background:#fafbf8;width:min(680px,100%);max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;padding:26px;animation:enter 280ms cubic-bezier(.2,.8,.2,1)}.panel .close{float:right}.panel h2{margin-top:8px}.item{padding:16px 0;border-bottom:1px solid #d9e0d8}.spacer{height:18px}@keyframes enter{from{transform:translateY(45px);opacity:0}to{transform:none;opacity:1}}.reduce *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:720px){header{padding:14px 18px}h1{font-size:30px}.page{padding:20px 18px 100px}.panel{padding:22px}.row>button{flex-grow:1}}</style><body><div class="page"><span class="pill">入戏 / COMPONENTS C2</span><h1>安静的界面，明确的反馈。</h1><div class="grid"><div class="card"><h2>操作状态</h2><div class="row"><button class="primary">检查餐具 · 1 点</button><button disabled>行动力不足</button><button>待本步结算…</button></div><p>成功：获得一条新线索</p><p class="error">场景已变化 · 未扣点</p></div><div class="card"><h2>自由行动输入</h2><label>你想做什么？</label><textarea>我想用灭火器打开后厨门</textarea><p class="muted">先判断，再确认费用。</p><button class="primary">判断可行性</button></div><div class="card"><h2>提案确认</h2><p>用灭火器破门</p><span class="pill">2 点行动力</span><p>将制造噪声。确认后等待本步结算。</p><button class="primary">确认行动</button> <button>取消</button></div><div class="card"><h2>个人知识</h2><span class="pill">仅你知道</span><p>餐具边缘有焦黑粉末。</p><button>分享给队友…</button><p class="muted">离开地点不会失去已知信息。</p></div></div></div></body></html>
