<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入戏 剧本工作台原型</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#172522;font:15px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid #d4ded8;border-radius:12px;background:#fff;color:inherit;padding:12px 16px;cursor:pointer;min-height:48px;transition:transform 90ms,background 140ms}button:active{transform:scale(.98)}button:hover{background:#e7ede8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fae9b;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#245f52;color:white;border:0}.primary:hover{background:#174c40}.quiet{background:transparent}.muted{color:#5a6964;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid #dbe1db}.brand{font-size:20px;font-weight:700;letter-spacing:4px}.pill{display:inline-block;background:#e6ede5;border-radius:30px;padding:6px 12px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:white;padding:24px;border:1px solid #dde3dd;border-radius:24px}.page{max-width:1100px;margin:auto;padding:32px 24px 100px}h1{font-size:38px;letter-spacing:-1px;margin:12px 0 16px}h2{font-size:23px}p{line-height:1.8}nav{display:flex;gap:10px;padding:12px;justify-content:center}nav.main{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ffffffef;border:1px solid #dde2dc;border-radius:22px;box-shadow:0 8px 24px #17252212;z-index:3}input,textarea,select{border:1px solid #aab9ad;border-radius:12px;background:#fff;padding:12px;width:100%;color:inherit}label{display:block;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.error{color:#a73535}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:16px;background:#172522;color:#fff;z-index:10;max-width:90vw}.overlay{position:fixed;inset:0;background:#07151080;z-index:5;display:flex;align-items:flex-end;justify-content:center}.panel{background:#fafbf8;width:min(680px,100%);max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;padding:26px;animation:enter 280ms cubic-bezier(.2,.8,.2,1)}.panel .close{float:right}.panel h2{margin-top:8px}.item{padding:16px 0;border-bottom:1px solid #d9e0d8}.spacer{height:18px}@keyframes enter{from{transform:translateY(45px);opacity:0}to{transform:none;opacity:1}}.reduce *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:720px){header{padding:14px 18px}h1{font-size:30px}.page{padding:20px 18px 100px}.panel{padding:22px}.row>button{flex-grow:1}}
body{height:100dvh;overflow:hidden}.shell{display:grid;grid-template-columns:190px minmax(300px,1fr) 350px;height:calc(100dvh - 84px)}aside{padding:20px;background:#eef1ea;border-right:1px solid #d5ded3;overflow:auto}.inspector{background:white;border-left:1px solid #d5ded3;padding:22px;overflow:auto}.canvas{background-color:#f6f6f1;background-image:radial-gradient(#bdc8b8 1px,transparent 1px);background-size:22px 22px;overflow:auto;padding:28px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.places{display:flex;align-items:flex-start;gap:22px;min-width:670px;padding:24px 0}.place{background:#ffffffeb;border:1px solid #cbd7c7;border-radius:22px;padding:20px;width:225px;cursor:pointer;box-shadow:0 12px 30px #243b2810}.place.selected{outline:2px solid #245f52;outline-offset:3px}.place .obj{display:block;width:100%;text-align:left;margin-top:10px;font-size:13px;background:#f0f3eb;padding:10px}.edge{padding-top:58px;color:#82957f;font-size:24px}.event{margin:22px 0;padding:18px;background:#e6ece0;border-radius:16px;border-left:4px solid #5a795f}.sideitem{display:block;margin:6px 0;width:100%;text-align:left;background:transparent;border:0}.sideitem.active{background:#dce5d7}.tiny{font-size:12px}.status{font-size:12px;color:#476750}textarea.code{font-family:monospace;font-size:12px;min-height:180px}.inspector h2{font-size:22px}.inspector button{margin-top:8px}header .brand{white-space:nowrap}@media(max-width:1000px){.shell{grid-template-columns:140px minmax(250px,1fr) 300px}}@media(max-width:720px){body{height:auto;overflow:auto}.shell{display:flex;flex-direction:column;height:auto}aside{display:flex;padding:10px;overflow:auto;gap:8px}.sideitem{width:auto;white-space:nowrap}.inspector{border-top:1px solid #ccd8c7}.canvas{min-height:400px}header{flex-wrap:wrap}.places{min-width:670px}aside h3,aside .tiny{display:none}}
</style><body><header><div class="brand">入戏 <span class="muted">STUDIO</span></div><div><strong>停电之前</strong> <span class="pill">草稿 C2</span></div><div class="row"><span id="saveStatus" class="status">本地演示 · 已载入</span><button onclick="undo()">撤销</button><button onclick="saveDraft()">保存</button><button class="primary" onclick="validate()">校验与发布</button></div></header><div class="shell"><aside><h3>项目</h3><button class="sideitem active" onclick="view='world';draw()">世界地图</button><button class="sideitem" onclick="view='events';draw()">事件关联</button><button class="sideitem" onclick="openTask()">小说改编</button><button class="sideitem" onclick="openAssets()">素材库</button><h3>角色视角</h3><select id="role" onchange="preview()"><option>旅客</option><option>医生</option><option>记者</option></select><p class="tiny">相同实体，多种视图。<br>修改会反映到关联事件。</p></aside><section class="canvas"><div class="toolbar"><span class="pill">地点 → 对象 → 行动 → 事件</span><button onclick="preview()">角色预览</button><button onclick="exportJson()">导出 DSL</button></div><p class="muted">HTML 行为参考；真实 React Flow 实验文件随包提供。</p><div id="graph"></div><div id="report" aria-live="polite"></div></section><section class="inspector" id="inspector"></section></div><div id="modal"></div><div id="toast" role="status"></div><script>
const initial={"schema_version": 3, "id": "restaurant", "title": "停电之前", "rules": {"ap_per_round": 3, "step_timeout_s": 45, "proposal_ttl_s": 60, "round_limit": 4}, "roles": [{"id": "guest", "label": "旅客", "location": "dining", "knowledge": []}, {"id": "doctor", "label": "医生", "location": "dining", "knowledge": []}, {"id": "reporter", "label": "记者", "location": "dining", "knowledge": []}], "locations": [{"id": "dining", "label": "餐厅", "description": "雨声掩盖了灯管的嗡鸣。", "discovered": true}, {"id": "hall", "label": "走廊", "description": "后厨门上的指示灯忽明忽暗。", "discovered": true}, {"id": "kitchen", "label": "后厨", "description": "电源箱旁有焦糊味。", "discovered": true}], "links": [{"id": "dining_hall", "from": "dining", "to": "hall", "cost": 1, "condition": {"op": "all", "args": []}}, {"id": "hall_dining", "from": "hall", "to": "dining", "cost": 1, "condition": {"op": "all", "args": []}}, {"id": "hall_kitchen", "from": "hall", "to": "kitchen", "cost": 1, "condition": {"op": "eq", "ref": "world.door_open", "value": true}}, {"id": "kitchen_hall", "from": "kitchen", "to": "hall", "cost": 1, "condition": {"op": "all", "args": []}}], "objects": [{"id": "dishes", "label": "餐具", "location": "dining", "tags": ["inspectable"]}, {"id": "waiter", "label": "服务员", "location": "dining", "tags": ["npc"]}, {"id": "fire_extinguisher", "label": "灭火器", "location": "hall", "tags": ["tool"]}, {"id": "door", "label": "后厨门", "location": "hall", "tags": ["breakable"]}, {"id": "power_box", "label": "电源箱", "location": "kitchen", "tags": ["switch"]}], "clues": [{"id": "stain", "text": "餐具边缘有焦黑粉末，像从通风口落下。", "shareable": true}, {"id": "access", "text": "服务员允许检查后厨，门禁为0427。", "shareable": true}], "actions": [{"id": "inspect", "label": "检查餐具", "location": "dining", "target": "dishes", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "stain", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "meal", "label": "用餐", "location": "dining", "target": null, "cost": 2, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "access", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "ask", "label": "询问服务员", "location": "dining", "target": "waiter", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "reveal", "ref": "access", "audience": "self"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "take_tool", "label": "取下灭火器", "location": "hall", "target": "fire_extinguisher", "cost": 1, "condition": {"op": "all", "args": []}, "effects": [{"op": "grant", "ref": "fire_extinguisher"}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "unlock", "label": "输入门禁", "location": "hall", "target": "door", "cost": 1, "condition": {"op": "all", "args": [{"op": "has_knowledge", "ref": "access"}, {"op": "eq", "ref": "world.door_open", "value": false}]}, "effects": [{"op": "set", "ref": "world.door_open", "value": true}], "failure": [], "threshold": null, "max_uses": 1}, {"id": "switch_off", "label": "关闭故障电源", "location": "kitchen", "target": "power_box", "cost": 1, "condition": {"op": "eq", "ref": "world.power_off", "value": false}, "effects": [{"op": "set", "ref": "world.power_off", "value": true}], "failure": [], "threshold": null, "max_uses": 1}], "templates": [{"id": "force_door", "label": "用灭火器破门", "location": "hall", "target": "door", "cost": 2, "condition": {"op": "all", "args": [{"op": "owns", "ref": "fire_extinguisher"}, {"op": "eq", "ref": "world.door_open", "value": false}]}, "effects": [{"op": "set", "ref": "world.door_open", "value": true}, {"op": "set", "ref": "world.noise", "value": true}], "failure": [], "threshold": null, "max_uses": 1, "intent": "使用工具破坏目标", "required_tag": "breakable"}], "events": [{"id": "safe_ending", "trigger": "step_end", "priority": 10, "condition": {"op": "eq", "ref": "world.power_off", "value": true}, "effects": [{"op": "end", "value": "safe"}], "once": true}, {"id": "timeout", "trigger": "round_end", "priority": 100, "condition": {"op": "gte", "ref": "clock.round", "value": 4}, "effects": [{"op": "end", "value": "evacuated"}], "once": true}], "initial": {"world": {"door_open": false, "power_off": false, "noise": false}, "inventory": {"guest": [], "doctor": [], "reporter": []}}, "media": [{"id": "opening", "kind": "text", "uri": "", "audience": "public", "summary": "三位客人发现餐厅电力异常。可以调查、用餐或与服务员交谈。"}, {"id": "safe", "kind": "text", "uri": "", "audience": "public", "summary": "电源被及时关闭，餐厅排除了危险。"}, {"id": "evacuated", "kind": "text", "uri": "", "audience": "public", "summary": "警报响起，所有人离开餐厅。谜团暂未解开。"}]};let data=JSON.parse(localStorage.getItem('ruxi_studio')||'null')||structuredClone(initial),selected='dining',action='inspect',view='world',history=[],dirty=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let el=document.getElementById('toast');el.className='toast';el.textContent=t;setTimeout(()=>{el.className='';el.textContent=''},2200)}
function select(id,a){selected=id;action=a||data.actions.find(x=>x.location===id)?.id;draw()}
function draw(){document.getElementById('graph').innerHTML=`<div class="places">${data.locations.map((l,i)=>`${i?'<span class="edge">↔</span>':''}<article class="place ${selected===l.id?'selected':''}" onclick="select('${l.id}')"><span class="tiny">LOCATION · ${l.id}</span><h2>${esc(l.label)}</h2><p class="muted">${esc(l.description)}</p>${data.actions.filter(a=>a.location===l.id).map(a=>`<button class="obj" onclick="event.stopPropagation();select('${l.id}','${a.id}')">${esc(a.label)} <span class="muted">${a.cost} 点</span></button>`).join('')}</article>`).join('')}</div>`+(view==='events'?data.events.map(e=>`<div class="event"><strong>${e.id}</strong><p>触发：${e.trigger} · 优先级 ${e.priority}</p><code>${esc(JSON.stringify(e.condition))}</code><p>关联地点：${e.id==='safe_ending'?'后厨 / 关闭故障电源':'全地图 / 世界时间'}</p><button onclick="select('kitchen','switch_off')">定位相关行动</button></div>`).join(''):'<div class="event"><strong>剧情关联</strong><p>餐厅获得门禁 → 走廊开门 → 后厨关闭电源 → 排险结局</p><button onclick="view=\'events\';draw()">查看事件条件</button></div>');let a=data.actions.find(x=>x.id===action);document.getElementById('inspector').innerHTML=a?`<span class="pill">${data.locations.find(x=>x.id===selected).label} / 行动</span><h2>${esc(a.label)}</h2><p class="muted">实体 ${a.id} · 修改同一份领域数据</p><label for="label">玩家看到的操作</label><input id="label" value="${esc(a.label)}"><label for="cost">行动力成本</label><input id="cost" type="number" min="0" max="10" value="${a.cost}"><label for="effects">效果 JSON</label><textarea id="effects" class="code">${esc(JSON.stringify(a.effects,null,2))}</textarea><button class="primary" onclick="apply()">应用修改</button><h3>关联与引用</h3><p class="muted">目标：${a.target||'地点'}<br>所在地点：${a.location}<br>条件：${esc(JSON.stringify(a.condition))}</p><button onclick="view=\'events\';draw()">查看相关事件</button><button onclick="injectError()">演示：制造无效费用</button>`:'<h2>地点属性</h2>'}
function apply(){try{let eff=JSON.parse(document.getElementById('effects').value),cost=Number(document.getElementById('cost').value);if(!Number.isInteger(cost)||cost<0||cost>10)throw Error('费用必须是0—10整数');if(!Array.isArray(eff))throw Error('效果必须是数组');history.push(structuredClone(data));let a=data.actions.find(x=>x.id===action);a.label=document.getElementById('label').value;a.cost=cost;a.effects=eff;dirty=true;document.getElementById('saveStatus').textContent='尚未保存';draw()}catch(e){toast(e.message)}}
function undo(){if(history.length){data=history.pop();dirty=true;draw();toast('已撤销本次草稿修改')}else toast('没有可撤销修改')}
function saveDraft(){localStorage.setItem('ruxi_studio',JSON.stringify(data));dirty=false;document.getElementById('saveStatus').textContent='已保存到本地演示';toast('保存完成')}
function injectError(){history.push(structuredClone(data));data.actions.find(x=>x.id===action).cost=-1;dirty=true;draw();validate()}
function validate(){let errors=[];for(let a of data.actions){if(a.cost<0||!Number.isInteger(a.cost))errors.push({a,msg:'费用必须为非负整数',pointer:'/actions/'+data.actions.indexOf(a)+'/cost'});if(!data.locations.some(l=>l.id===a.location))errors.push({a,msg:'地点引用不存在',pointer:'/actions/'+data.actions.indexOf(a)+'/location'})}document.getElementById('report').innerHTML=errors.length?'<div class="card"><h2 class="error">校验失败 · 不能发布</h2>'+errors.map(e=>`<p>${e.msg} <code>${e.pointer}</code> <button onclick="select('${e.a.location}','${e.a.id}')">定位</button></p>`).join('')+'</div>':'<div class="card"><h2>演示校验通过</h2><p>已检查费用与地点引用。完整 Schema、受众、可达性和审核仍需正式服务校验。</p><button onclick="toast(\'已生成本地候选快照；并未发布到服务器\')">生成候选快照演示</button></div>';return errors}
function panel(title,body){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closePanel()"><section class="panel" role="dialog" aria-modal="true" aria-label="${title}"><button class="close" onclick="closePanel()">关闭</button><h2>${title}</h2>${body}</section></div>`;document.querySelector('.panel button').focus()}
function closePanel(){document.getElementById('modal').innerHTML=''}
function preview(){let role=document.getElementById('role').value;panel(role+' · 角色预览','<p>编辑器模拟视角，不是玩家端切换角色权限。</p><div class="card"><span class="pill">'+data.locations.find(x=>x.id===selected).label+'</span><p>当前角色只收到授权信息；未调查时不显示线索正文。</p>'+data.actions.filter(a=>a.location===selected).map(a=>'<p>'+esc(a.label)+' · '+a.cost+'点</p>').join('')+'</div>')}
function openTask(){panel('小说改编任务','<p>此处演示任务找回和修改保护，不调用模型。</p><label for="chapter">源章节</label><textarea id="chapter" rows="4">餐厅的灯忽明忽暗。服务员看了一眼后厨。</textarea><label><input id="locked" style="width:auto" type="checkbox" checked> 保留作者锁定字段</label><button onclick="document.getElementById(\'taskresult\').innerHTML=\'<p>模拟提案：新增后厨调查。来源：第1章第1段。分类：改编新增。需作者确认，不自动写入。</p>\'">生成改编提案演示</button><div id="taskresult"></div>')}
function openAssets(){panel('素材库',data.media.map(m=>'<div class="item"><strong>'+m.id+'</strong><p>'+m.summary+'</p><span class="pill">文字替代 · ready</span></div>').join(''))}
function exportJson(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='restaurant_draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();const p=document.querySelector('.panel');if(e.key==='Tab'&&p){const f=[...p.querySelectorAll('button,input,textarea')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});draw();
</script></body></html>
