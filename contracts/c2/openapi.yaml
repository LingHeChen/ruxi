  /identities/guest:
    post:
      summary: 建立游客身份
      operationId: post_identities_guest
      responses:
        '200':
          description: 操作成功，异步操作返回任务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: &id001
                    type: string
                  access_token: *id001
                  refresh_token: *id001
                  recovery_code: *id001
                required:
                - user_id
                - access_token
                - refresh_token
                - recovery_code
                additionalProperties: false
        '400':
          description: 输入错误
          content:
            application/json:
              schema: &id003
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: &id002
                        type: string
                      safe_message: *id002
                      retryable: &id009
                        type: boolean
                      trace_id: *id002
                    required:
                    - code
                    - safe_message
                    - retryable
                    - trace_id
                    additionalProperties: false
                required:
                - error
                additionalProperties: false
        '401':
          description: 身份失效
          content:
            application/json:
              schema: *id003
        '403':
          description: 无权限
          content:
            application/json:
              schema: *id003
        '409':
          description: 状态或幂等冲突
          content:
            application/json:
              schema: *id003
        '422':
          description: 校验失败
          content:
            application/json:
              schema: *id003
        '429':
          description: 限频
          content:
            application/json:
              schema: *id003
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema: *id003
      security: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
